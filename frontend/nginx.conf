# One origin for the whole app: static bundle plus the API and artifact tree.
# Same-origin keeps EventSource and <video> Range requests free of CORS and
# preflight, exactly as the Vite dev proxy does in development.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback
    }

    location /api/     { proxy_pass http://api:8000; include /etc/nginx/proxy_common.conf; }
    location /media/   { proxy_pass http://api:8000; include /etc/nginx/proxy_common.conf; }
    location /docs     { proxy_pass http://api:8000; include /etc/nginx/proxy_common.conf; }
    location /openapi.json { proxy_pass http://api:8000; include /etc/nginx/proxy_common.conf; }
    location /healthz  { proxy_pass http://api:8000; include /etc/nginx/proxy_common.conf; }
    location /readyz   { proxy_pass http://api:8000; include /etc/nginx/proxy_common.conf; }
}
